server:
  port: 8081

spring:
  application:
    name: user-service
  mongodb:
    uri: mongodb://root:password@localhost:27020/user_service?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:buy01-local-dev-secret-32bytes-min-1234}
  expiration-ms: 86400000