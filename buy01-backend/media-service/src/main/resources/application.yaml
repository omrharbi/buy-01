server:
  port: ${MEDIA_SERVICE_PORT:8083}

spring:
  application:
    name: media-service
  config:
    # Load local secrets from .env (run from media-service dir or repo root)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:buy01-backend/.env[.properties]
      - optional:file:buy01-backend/media-service/.env[.properties]
  mongodb:
    uri: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST:localhost}:${MEDIA_DB_PORT:27019}/media-service-db?authSource=admin
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  secret: ${JWT_SECRET}