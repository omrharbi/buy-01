spring:
  application:
    name: eureka-server
server:
  port: 8761
  eureka:
      instance:
        hostname: localhost
      server:
        enable-self-preservation: true  #  Enabled to avoid mass removal of services due to network issues.
      client:
        register-with-eureka: false
        fetch-registry: false
        service-url:
          defaultZone: http://localhost:8761/eureka/